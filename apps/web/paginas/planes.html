<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis planes · Planazo</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <p class="centro" id="cargando">Cargando…</p>
  <main class="form-pag" id="contenido" hidden>
    <div>
      <div class="barra">
        <h1 id="saludo">Hola</h1>
        <div>
          <button class="boton-linea" type="button" id="ver-historial" style="margin-right:8px">Historial</button>
          <button class="boton-linea" type="button" id="salir">Cerrar sesión</button>
        </div>
      </div>
      <div class="caja caja-ancha" id="caja-historial" hidden style="margin-top:16px">
        <h2>Historial</h2>
        <p class="vacio" id="vacio-cambios" hidden>Todavía no hay cambios.</p>
        <div id="cambios"></div>
      </div>
      <div class="caja caja-ancha">
        <h2 id="titulo-form">Nuevo plan</h2>
        <form id="nuevo">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" placeholder="Cena del viernes">
          <label for="fecha">Fecha límite</label>
          <input id="fecha" type="text" placeholder="5 de octubre">
          <p class="error" id="err-plan" hidden></p>
          <button class="boton" id="btn-crear">Crear plan</button>
          <button class="boton-linea" type="button" id="btn-dejar" hidden style="margin-top:10px">Dejar de editar</button>
        </form>
      </div>
      <div class="caja caja-ancha" style="margin-top:16px">
        <h2>Tus planes</h2>
        <label for="busca">Buscar</label>
        <input id="busca" type="text" placeholder="Nombre del plan">
        <label for="filtro">Estado</label>
        <select id="filtro">
          <option value="">Todos</option>
          <option value="borrador">Borrador</option>
          <option value="confirmado">Confirmado</option>
          <option value="cancelado">Cancelado</option>
        </select>
        <p class="vacio" id="vacio">Todavía no hay ninguno.</p>
        <p class="vacio" id="nada" hidden>Ninguno coincide.</p>
        <div id="lista"></div>
      </div>
    </div>
  </main>
  <script src="/js/comun.js"></script>
  <script>
    var todos = [];
    var editando = null;
    var ultimo = null;
    var fallo = null;
    var falloTexto = "";
    var miId = null;

    pedir("/api/auth/me").then(function (res) {
      if (!res.ok) {
        location.replace("/login");
        return;
      }
      miId = res.json.user.id;
      document.getElementById("saludo").textContent = "Hola, " + res.json.user.nombre;
      document.getElementById("cargando").hidden = true;
      document.getElementById("contenido").hidden = false;
      cargarPlanes();
    });

    async function cargarPlanes() {
      var res = await pedir("/api/planes");
      todos = res.json.planes || [];
      mostrarLista();
    }

    async function cargarCambios() {
      var res = await pedir("/api/cambios");
      var cambios = res.json.cambios || [];
      var lista = document.getElementById("cambios");
      var vacio = document.getElementById("vacio-cambios");
      lista.innerHTML = "";
      vacio.hidden = cambios.length > 0;

      for (var i = 0; i < cambios.length; i++) {
        var cambio = cambios[i];
        var div = document.createElement("div");
        div.className = "plan";
        var accion = cambio.accion;
        if (accion === "creado") accion = "Creado";
        if (accion === "editado") accion = "Editado";
        if (accion === "confirmado") accion = "Confirmado";
        if (accion === "cancelado") accion = "Cancelado";
        var resultado = cambio.resultado;
        if (resultado === "borrador") resultado = "Borrador";
        if (resultado === "confirmado") resultado = "Confirmado";
        if (resultado === "cancelado") resultado = "Cancelado";
        var cuando = cambio.created_at || "";
        cuando = cuando.replace("T", " ").slice(0, 16);

        var texto = document.createElement("p");
        texto.textContent = cambio.nombre + " · " + accion;
        div.appendChild(texto);
        var nota = document.createElement("p");
        nota.className = "nota";
        nota.textContent = resultado + " · " + cuando;
        div.appendChild(nota);
        lista.appendChild(div);
      }
    }

    document.getElementById("ver-historial").onclick = function () {
      var caja = document.getElementById("caja-historial");
      if (!caja.hidden) {
        caja.hidden = true;
        this.textContent = "Historial";
        return;
      }
      caja.hidden = false;
      this.textContent = "Ocultar";
      cargarCambios();
    };

    function mostrarLista() {
      var lista = document.getElementById("lista");
      var vacio = document.getElementById("vacio");
      var nada = document.getElementById("nada");
      var q = document.getElementById("busca").value.trim().toLowerCase();
      var filtro = document.getElementById("filtro").value;
      lista.innerHTML = "";

      var planes = [];
      for (var i = 0; i < todos.length; i++) {
        var item = todos[i];
        if (filtro && item.estado !== filtro) continue;
        if (q && item.nombre.toLowerCase().indexOf(q) === -1) continue;
        planes.push(item);
      }

      vacio.hidden = todos.length > 0;
      nada.hidden = todos.length === 0 || planes.length > 0;

      for (var j = 0; j < planes.length; j++) {
        var plan = planes[j];
        var div = document.createElement("div");
        div.className = "plan";
        var estado = plan.estado;
        if (estado === "borrador") estado = "Borrador";
        if (estado === "confirmado") estado = "Confirmado";
        if (estado === "cancelado") estado = "Cancelado";

        var texto = document.createElement("p");
        texto.textContent = plan.nombre + " · " + plan.fecha_limite + " · " + estado;
        div.appendChild(texto);

        var mio = String(plan.user_id) === String(miId);

        if (!mio) {
          var ajeno = document.createElement("p");
          ajeno.className = "nota";
          ajeno.textContent = "Participas en este plan. Solo quien organiza puede editarlo o cancelarlo.";
          div.appendChild(ajeno);
        }

        var participantes = document.createElement("p");
        participantes.className = "nota";
        var nombres = [];
        for (var p = 0; p < plan.participantes.length; p++) {
          nombres.push(plan.participantes[p].nombre);
        }
        participantes.textContent = nombres.length ? "Participantes: " + nombres.join(", ") : "Todavía no hay participantes invitados.";
        div.appendChild(participantes);

        if (mio && plan.estado !== "cancelado") {
          var etiquetaParticipante = document.createElement("label");
          etiquetaParticipante.textContent = "Invitar participante";
          etiquetaParticipante.setAttribute("for", "participante-" + plan.id);
          div.appendChild(etiquetaParticipante);
          var correo = document.createElement("input");
          correo.type = "email";
          correo.id = "participante-" + plan.id;
          correo.placeholder = "correo@ejemplo.com";
          div.appendChild(correo);
          var invitar = document.createElement("button");
          invitar.className = "boton-linea";
          invitar.type = "button";
          invitar.textContent = "Agregar participante";
          invitar.style.marginTop = "8px";
          invitar.setAttribute("data-id", plan.id);
          invitar.onclick = function () {
            agregarParticipante(this.getAttribute("data-id"));
          };
          div.appendChild(invitar);
        }

        if (!mio && plan.estado !== "cancelado") {
          var etiquetaTipo = document.createElement("label");
          etiquetaTipo.textContent = "Nueva propuesta";
          etiquetaTipo.setAttribute("for", "tipo-" + plan.id);
          div.appendChild(etiquetaTipo);
          var tipo = document.createElement("select");
          tipo.id = "tipo-" + plan.id;
          tipo.innerHTML = "<option value=\"fecha\">Fecha</option><option value=\"lugar\">Lugar</option>";
          div.appendChild(tipo);
          var propuesta = document.createElement("input");
          propuesta.id = "propuesta-" + plan.id;
          propuesta.type = "text";
          propuesta.placeholder = "Ejemplo: sábado 10 de octubre";
          div.appendChild(propuesta);
          var proponer = document.createElement("button");
          proponer.className = "boton-linea";
          proponer.type = "button";
          proponer.textContent = "Agregar propuesta";
          proponer.style.marginTop = "8px";
          proponer.setAttribute("data-id", plan.id);
          proponer.onclick = function () {
            crearPropuesta(this.getAttribute("data-id"));
          };
          div.appendChild(proponer);
        }

        var tituloPropuestas = document.createElement("p");
        tituloPropuestas.className = "nota";
        tituloPropuestas.textContent = "Propuestas y votos";
        div.appendChild(tituloPropuestas);
        if (plan.propuestas.length === 0) {
          var sinPropuestas = document.createElement("p");
          sinPropuestas.className = "nota";
          sinPropuestas.textContent = "Todavía no hay propuestas.";
          div.appendChild(sinPropuestas);
        }
        for (var k = 0; k < plan.propuestas.length; k++) {
          var itemPropuesta = plan.propuestas[k];
          var propuestaDiv = document.createElement("div");
          propuestaDiv.className = "propuesta";
          var detalle = document.createElement("p");
          var tipoTexto = itemPropuesta.tipo === "fecha" ? "Fecha" : "Lugar";
          detalle.textContent = tipoTexto + ": " + itemPropuesta.contenido + " · " + itemPropuesta.votos + " voto(s) · Propuesta por " + itemPropuesta.autor;
          propuestaDiv.appendChild(detalle);
          if (!mio && plan.estado !== "cancelado") {
            var votarBoton = document.createElement("button");
            votarBoton.className = "boton-linea";
            votarBoton.type = "button";
            votarBoton.textContent = itemPropuesta.mi_voto ? "Tu voto" : "Votar";
            votarBoton.disabled = itemPropuesta.mi_voto;
            votarBoton.setAttribute("data-plan", plan.id);
            votarBoton.setAttribute("data-propuesta", itemPropuesta.id);
            votarBoton.onclick = function () {
              votar(this.getAttribute("data-plan"), this.getAttribute("data-propuesta"));
            };
            propuestaDiv.appendChild(votarBoton);
          }
          div.appendChild(propuestaDiv);
        }

        if (mio && (plan.estado === "borrador" || plan.estado === "confirmado")) {
          var botonCancelar = document.createElement("button");
          botonCancelar.className = "boton";
          botonCancelar.type = "button";
          botonCancelar.textContent = "Cancelar plan";
          botonCancelar.style.width = "auto";
          botonCancelar.style.display = "inline-block";
          botonCancelar.style.marginTop = "0";
          botonCancelar.style.marginRight = "8px";
          botonCancelar.onclick = function () {
            cancelar(this.getAttribute("data-id"));
          };
          botonCancelar.setAttribute("data-id", plan.id);
          div.appendChild(botonCancelar);

          var otros = document.createElement("span");
          otros.hidden = true;

          if (plan.estado === "borrador") {
            var boton = document.createElement("button");
            boton.className = "boton-linea";
            boton.type = "button";
            boton.textContent = "Confirmar plan";
            boton.style.marginRight = "8px";
            boton.onclick = function () {
              confirmar(this.getAttribute("data-id"));
            };
            boton.setAttribute("data-id", plan.id);
            otros.appendChild(boton);
          }

          var botonEditar = document.createElement("button");
          botonEditar.className = "boton-linea";
          botonEditar.type = "button";
          botonEditar.textContent = "Editar";
          botonEditar.style.marginRight = "8px";
          botonEditar.onclick = function () {
            empezarEdicion(this.getAttribute("data-id"));
          };
          botonEditar.setAttribute("data-id", plan.id);
          otros.appendChild(botonEditar);

          var mas = document.createElement("button");
          mas.className = "boton-linea";
          mas.type = "button";
          mas.textContent = "Más";
          mas.onclick = function () {
            otros.hidden = !otros.hidden;
            this.textContent = otros.hidden ? "Más" : "Ocultar";
          };
          div.appendChild(mas);
          div.appendChild(otros);
        }

        if (mio && plan.estado === "cancelado") {
          var nota = document.createElement("p");
          nota.className = "nota";
          nota.textContent = "Ya está cancelado. No se puede confirmar ni cancelar otra vez.";
          div.appendChild(nota);
        }

        if (String(plan.id) === ultimo) {
          var aviso = document.createElement("p");
          aviso.className = "ok";
          aviso.textContent = plan.nombre + " quedó cancelado.";
          div.appendChild(aviso);
        }

        if (String(plan.id) === fallo) {
          var mal = document.createElement("p");
          mal.className = "error";
          mal.textContent = falloTexto;
          div.appendChild(mal);
        }

        lista.appendChild(div);
      }
    }

    document.getElementById("busca").oninput = function () {
      mostrarLista();
    };

    document.getElementById("filtro").onchange = function () {
      mostrarLista();
    };

    function empezarEdicion(id) {
      var plan = null;
      for (var i = 0; i < todos.length; i++) {
        if (String(todos[i].id) === String(id)) plan = todos[i];
      }
      if (!plan) return;
      editando = plan.id;
      document.getElementById("titulo-form").textContent = "Editar plan";
      document.getElementById("nombre").value = plan.nombre;
      document.getElementById("fecha").value = plan.fecha_limite;
      document.getElementById("btn-crear").textContent = "Guardar cambios";
      document.getElementById("btn-dejar").hidden = false;
      mostrar("err-plan", "");
      document.getElementById("nombre").focus();
    }

    function dejarEdicion() {
      editando = null;
      document.getElementById("titulo-form").textContent = "Nuevo plan";
      document.getElementById("nombre").value = "";
      document.getElementById("fecha").value = "";
      document.getElementById("btn-crear").textContent = "Crear plan";
      document.getElementById("btn-dejar").hidden = true;
      mostrar("err-plan", "");
    }

    document.getElementById("btn-dejar").onclick = function () {
      dejarEdicion();
    };

    document.getElementById("nuevo").onsubmit = async function (e) {
      e.preventDefault();
      var nombre = document.getElementById("nombre").value.trim();
      var fecha = document.getElementById("fecha").value.trim();
      mostrar("err-plan", "");
      if (!nombre || !fecha) {
        mostrar("err-plan", "Escribe el nombre y la fecha.");
        return;
      }
      var boton = document.getElementById("btn-crear");
      boton.disabled = true;
      var res;
      if (editando) {
        res = await pedir("/api/planes/actualizar", { id: editando, nombre: nombre, fecha: fecha });
      } else {
        res = await pedir("/api/planes", { nombre: nombre, fecha: fecha });
      }
      boton.disabled = false;
      if (!res.ok) {
        mostrar("err-plan", res.json.message || "No se pudo guardar. Revisa el nombre y la fecha.");
        return;
      }
      dejarEdicion();
      cargarPlanes();
    };

    async function confirmar(id) {
      var res = await pedir("/api/planes/confirmar", { id: id });
      if (!res.ok) {
        fallo = String(id);
        falloTexto = (res.json && res.json.message) || "No se pudo confirmar. Recarga la página.";
        mostrar("err-plan", "");
        mostrarLista();
        return;
      }
      fallo = null;
      cargarPlanes();
    }

    async function cancelar(id) {
      var plan = null;
      for (var i = 0; i < todos.length; i++) {
        if (String(todos[i].id) === String(id)) plan = todos[i];
      }
      var pregunta = "¿Cancelar este plan?";
      if (plan) {
        var estado = plan.estado;
        if (estado === "borrador") estado = "Borrador";
        if (estado === "confirmado") estado = "Confirmado";
        pregunta = "¿Cancelar " + plan.nombre + "? " + plan.fecha_limite + " · " + estado;
      }
      if (!window.confirm(pregunta)) {
        return;
      }
      var res = await pedir("/api/planes/cancelar", { id: id });
      if (!res.ok) {
        fallo = String(id);
        falloTexto = (res.json && res.json.message) || "No se pudo cancelar. Recarga la página.";
        mostrar("err-plan", "");
        mostrarLista();
        return;
      }
      mostrar("err-plan", "");
      fallo = null;
      ultimo = String(id);
      cargarPlanes();
    }

    async function agregarParticipante(id) {
      var correo = document.getElementById("participante-" + id).value.trim();
      if (!correo) {
        fallo = String(id);
        falloTexto = "Escribe el correo del usuario que quieres invitar.";
        mostrarLista();
        return;
      }
      var res = await pedir("/api/planes/participantes", { id: id, correo: correo });
      if (!res.ok) {
        fallo = String(id);
        falloTexto = res.json.message || "No se pudo agregar el participante.";
        mostrarLista();
        return;
      }
      fallo = null;
      cargarPlanes();
    }

    async function crearPropuesta(id) {
      var contenido = document.getElementById("propuesta-" + id).value.trim();
      var tipo = document.getElementById("tipo-" + id).value;
      if (!contenido) {
        fallo = String(id);
        falloTexto = "Escribe una fecha o un lugar para proponer.";
        mostrarLista();
        return;
      }
      var res = await pedir("/api/planes/propuestas", { id: id, tipo: tipo, contenido: contenido });
      if (!res.ok) {
        fallo = String(id);
        falloTexto = res.json.message || "No se pudo guardar la propuesta.";
        mostrarLista();
        return;
      }
      fallo = null;
      cargarPlanes();
    }

    async function votar(id, propuestaId) {
      var res = await pedir("/api/planes/votos", { id: id, propuesta_id: propuestaId });
      if (!res.ok) {
        fallo = String(id);
        falloTexto = res.json.message || "No se pudo guardar el voto.";
        mostrarLista();
        return;
      }
      fallo = null;
      cargarPlanes();
    }

    document.getElementById("salir").onclick = async function () {
      this.disabled = true;
      this.textContent = "Cerrando…";
      await pedir("/api/auth/logout", {});
      location.replace("/login");
    };
  </script>
</body>
</html>
